[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2docx"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
md2docx = "md2docx.converter:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md2docx"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-docx>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
